services:
  mariadb:
    image: mariadb:13.1.1-ubi10-rc
    container_name: dev-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT_HOST}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: